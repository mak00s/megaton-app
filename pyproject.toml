[project]
name = "megaton-app"
version = "0.31.2"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "megaton>=2.1.2",
    "pandas",
    "requests",
]

[project.optional-dependencies]
audit = [
    "PyYAML",
]
dev = [
    "pytest",
    "pytest-cov",
    "pyright==1.1.411",
    "ruff",
]
google = [
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
    "google-cloud-bigquery",
    "gspread",
]
llm = [
    "anthropic",
    "openai",
]
notebook = [
    "ipywidgets",
    "japanize-matplotlib",
    "jupyter",
    "jupytext",
    "matplotlib",
    "plotly",
]
playwright = [
    "playwright>=1.40",
]
scrape = [
    "beautifulsoup4",
    "lxml",
]
ui = [
    "plotly",
    "streamlit",
    "streamlit-autorefresh",
]
validation = [
    "numpy",
    "Pillow",
    "playwright",
]
local = [
    "PyYAML",
    "beautifulsoup4",
    "google-api-python-client",
    "google-auth",
    "google-auth-oauthlib",
    "google-cloud-bigquery",
    "gspread",
    "ipywidgets",
    "japanize-matplotlib",
    "jupyter",
    "jupytext",
    "lxml",
    "matplotlib",
    "playwright",
    "plotly",
    "pytest",
    "pytest-cov",
    "streamlit",
    "streamlit-autorefresh",
]

[tool.setuptools.packages.find]
include = ["megaton_lib*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
markers = [
    "unit: fast, isolated tests (default layer)",
    "contract: interface/schema/output contract tests",
    "integration: cross-module flow tests",
]

[tool.ruff.lint]
# Keep the CI gate stable across Ruff releases. Broader rule families are
# adopted intentionally rather than changing whenever Ruff's defaults do.
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = [
    "megaton_lib/params_validator.py",
    "megaton_lib/audit/config.py",
    "megaton_lib/query_runner.py",
    "megaton_lib/batch_runner.py",
    "megaton_lib/job_manager.py",
    "megaton_lib/validation/contracts.py",
    "megaton_lib/validation/metadata.py",
]
