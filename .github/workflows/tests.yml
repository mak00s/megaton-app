name: Tests

on:
  push:
  pull_request:

jobs:
  repository-hygiene:
    runs-on: ubuntu-latest
    env:
      # Trusted = this repository's own pushes and same-repository pull requests.
      # Only those can read the denylist key. Fork pull requests, and pushes
      # inside a fork, get the key-free checks instead of being skipped. Trust
      # is decided by context, never by whether the secret happens to be set,
      # so a missing secret here fails the job.
      HYGIENE_TRUSTED: ${{ github.repository == 'mak00s/megaton-app' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history and tags: past file versions, commit messages,
          # identities and tag messages are checked too.
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check for private identifiers and secrets
        if: env.HYGIENE_TRUSTED == 'true'
        env:
          REPOSITORY_HYGIENE_KEY: ${{ secrets.REPOSITORY_HYGIENE_KEY }}
        run: python tools/check_repository_hygiene.py --history

      - name: Check for secrets only (no denylist key in this context)
        if: env.HYGIENE_TRUSTED != 'true'
        run: python tools/check_repository_hygiene.py --history --allow-missing-key

  packaging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Verify distribution contents
        run: |
          python tools/check_wheel.py dist/*.whl
          python tools/check_sdist.py dist/*.tar.gz

      - name: Verify installed import outside checkout
        run: |
          python -m venv /tmp/megaton-app-wheel-smoke
          /tmp/megaton-app-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/megaton-app-wheel-smoke/bin/python -c "import megaton_lib; print(megaton_lib.__file__)"
          # Module CLI must work from any cwd with no optional deps (guide never imports Playwright).
          /tmp/megaton-app-wheel-smoke/bin/python -m megaton_lib.browser_workflow guide --format json > /dev/null
          /tmp/megaton-app-wheel-smoke/bin/python -c "import importlib.util; assert importlib.util.find_spec('app') is None"
          /tmp/megaton-app-wheel-smoke/bin/python -c "import importlib.util; assert importlib.util.find_spec('scripts') is None"

  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pytest-cov pyright==1.1.411 ruff

      - name: Lint shared library
        run: ruff check megaton_lib

      - name: Type check contracts and static modules
        run: python -m pyright

      - name: Run tests and collect coverage
        run: |
          pytest -q \
            --cov=megaton_lib \
            --cov=scripts.query \
            --cov-report=term-missing

      - name: Enforce query CLI coverage
        run: python -m coverage report --include="scripts/query.py" --fail-under=90

      - name: Enforce shared library coverage
        run: python -m coverage report --include="megaton_lib/*" --fail-under=64
