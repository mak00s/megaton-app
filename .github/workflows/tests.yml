name: Tests

on:
  push:
  pull_request:

jobs:
  packaging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir dist

      - name: Verify wheel contents
        run: python tools/check_wheel.py dist/*.whl

      - name: Verify installed import outside checkout
        run: |
          python -m venv /tmp/megaton-app-wheel-smoke
          /tmp/megaton-app-wheel-smoke/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/megaton-app-wheel-smoke/bin/python -c "import megaton_lib; print(megaton_lib.__file__)"
          /tmp/megaton-app-wheel-smoke/bin/python -c "import importlib.util; assert importlib.util.find_spec('app') is None"
          /tmp/megaton-app-wheel-smoke/bin/python -c "import importlib.util; assert importlib.util.find_spec('scripts') is None"

  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest pytest-cov pyright==1.1.411 ruff

      - name: Lint shared library
        run: ruff check megaton_lib

      - name: Type check contracts and static modules
        run: python -m pyright

      - name: Run tests and collect coverage
        run: |
          pytest -q \
            --cov=megaton_lib \
            --cov=scripts.query \
            --cov-report=term-missing

      - name: Enforce query CLI coverage
        run: python -m coverage report --include="scripts/query.py" --fail-under=90

      - name: Enforce shared library coverage
        run: python -m coverage report --include="megaton_lib/*" --fail-under=64
